<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RR Music Academy - Excelencia Musical</title>
    
    <!-- 1. CARGA DE LIBRERÍAS (CDN) -->
    <link rel="icon" type="image/png" href="/images/logo.png?v=2" />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fuentes de Google -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Oswald:wght@500;700&family=Satisfy&display=swap" rel="stylesheet">
    
    <!-- Configuración de Tailwind -->
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Montserrat', 'sans-serif'],
              oswald: ['Oswald', 'sans-serif'],
              cursive: ['Satisfy', 'cursive'],
            },
            colors: {
              'rr-blue': '#0056b3',
              'rr-dark': '#0a192f',
              'rr-orange': '#f59e0b',
            },
            animation: {
                'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            }
          }
        }
      }
    </script>
    <style>
      body { font-family: 'Montserrat', sans-serif; }
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
      .perspective-1000 { perspective: 1000px; }
      .carousel-track { transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
</body>
</html>
